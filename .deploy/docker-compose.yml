# ============================================================
# New-API 全栈一键部署 (源码构建)
#   服务: new-api · wechat-epay-adapter · mysql · nginx
#
# 用法:
#   cd deploy && cp .env.example .env && nano .env
#   docker compose up -d --build
#
# 说明:
#   - new-api 与 wechat-epay-adapter 均从本地源码构建镜像
#   - MySQL / Nginx 使用官方镜像 (非 new-api 项目镜像)
#   - 所有容器在同一 Docker 网络, 通过容器名互访
# ============================================================

services:
  # ----------------------------------------------------------
  # MySQL 8.0 — new-api 与 wechat-epay-adapter 共用实例
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NEW_API_DB_NAME}
      MYSQL_USER: ${NEW_API_DB_USER}
      MYSQL_PASSWORD: ${NEW_API_DB_PASSWORD}
      WECHAT_DB_NAME: ${WECHAT_DB_NAME}
      WECHAT_DB_USER: ${WECHAT_DB_USER}
      WECHAT_DB_PASSWORD: ${WECHAT_DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_files:/var/lib/mysql-files
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - mysql_logs:/var/log/mysql
    command: --defaults-file=/etc/mysql/conf.d/custom.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - newapi-net

  # ----------------------------------------------------------
  # Redis — new-api 缓存 / 限流 / 会话协调
  # ----------------------------------------------------------
  #redis:
  #  image: redis:7-alpine
  #  container_name: redis
  #  restart: unless-stopped
  #  command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
  #  volumes:
  #    - redis_data:/data
  #  networks:
  #    - newapi-net
  #  healthcheck:
  #    test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
  #    interval: 10s
  #    timeout: 5s
  #    retries: 5

  # ----------------------------------------------------------
  # New-API — 从项目根目录源码构建
  # ----------------------------------------------------------
  new-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: new-api:source
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - newapi_data:/data
      - newapi_logs:/app/logs
    environment:
      - SQL_DSN=${NEW_API_DB_USER}:${NEW_API_DB_PASSWORD}@tcp(mysql:3306)/${NEW_API_DB_NAME}?charset=utf8mb4&parseTime=True&loc=Local
      #- REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - MEMORY_CACHE_ENABLED=true
      - NODE_NAME=new-api-node-1
      - TRUSTED_PROXIES=172.16.0.0/12
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - SESSION_COOKIE_TRUSTED_URL=${SESSION_COOKIE_TRUSTED_URL}
      - GENERATE_DEFAULT_TOKEN=${GENERATE_DEFAULT_TOKEN:-false}
    depends_on:
      mysql:
        condition: service_healthy
      #redis:
      #  condition: service_healthy
    networks:
      - newapi-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # WeChat Epay Adapter — 从 wechat-epay-adapter/ 源码构建
  # 可选: 仅在配置了微信支付后启动
  #   启动: docker compose --profile payment up -d --build
  #   不启动: docker compose up -d --build (仅 3 服务)
  # ----------------------------------------------------------
  wechat-epay-adapter:
    profiles: ["payment"]
    build:
      context: ../wechat-epay-adapter
    image: wechat-epay-adapter:source
    container_name: wechat-epay-adapter
    restart: unless-stopped
    env_file:
      - ./wechat-adapter/.env
    environment:
      - DATABASE_TYPE=mysql
      - DATABASE_DSN=${WECHAT_DB_USER}:${WECHAT_DB_PASSWORD}@tcp(mysql:3306)/${WECHAT_DB_NAME}?charset=utf8mb4&parseTime=True&loc=UTC
      - HTTP_LISTEN_ADDR=:8080
      - LOG_DIR=/tmp/logs
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ./wechat-adapter/secrets
        target: /run/secrets
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - newapi-net

  # ----------------------------------------------------------
  # Nginx — 反向代理 + TLS 终端
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx-real
    environment:
      - NEW_API_DOMAIN=${NEW_API_DOMAIN}
      - PAY_DOMAIN=${PAY_DOMAIN}
      - SSL_CERT=${SSL_CERT}
      - SSL_KEY=${SSL_KEY}
    depends_on:
      new-api:
        condition: service_started
    networks:
      - newapi-net

volumes:
  mysql_data:
  mysql_files:
  mysql_logs:
  newapi_data:
  newapi_logs:
  #redis_data:

networks:
  newapi-net:
    driver: bridge
