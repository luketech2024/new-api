<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>游乐场多媒体试玩 - 源码还原原型</title>
<style>
:root{--background:#fff;--foreground:#18181b;--muted:#f4f4f5;--muted-foreground:#71717a;--border:#e4e4e7;--primary:#18181b;--primary-foreground:#fafafa;--destructive:#dc2626;--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif}button,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.52}.page{height:100vh;min-height:580px;display:flex;flex-direction:column;overflow:hidden}.content{min-height:0;flex:1;overflow:auto}.inner{width:100%;max-width:896px;margin:auto;padding:16px}.input-wrap{width:100%;max-width:896px;margin:auto;padding:0 4px 16px}.notice{max-width:896px;margin:12px auto 0;padding:0 16px;font-size:12px;color:var(--muted-foreground)}
.empty{min-height:min(520px,calc(100svh - 18rem));padding:48px 4px 32px;display:flex;align-items:center;justify-content:center}.empty-body{width:100%;max-width:672px;display:grid;gap:20px;text-align:center}.empty-icon{width:44px;height:44px;margin:auto;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--muted) 50%,transparent);display:grid;place-items:center;color:var(--muted-foreground);font-size:20px}.empty h2{margin:0;font-size:24px;letter-spacing:-.02em}.empty p{max-width:512px;margin:8px auto 0;color:var(--muted-foreground);font-size:14px;line-height:24px}.prompts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.prompt{min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;display:flex;gap:8px;align-items:center;text-align:left;color:var(--foreground)}.prompt span{color:var(--muted-foreground);font-size:16px}.prompt:hover{background:var(--muted)}
.composer{overflow:hidden;border:1px solid color-mix(in srgb,var(--border) 70%,transparent);border-radius:12px;background:color-mix(in srgb,var(--background) 95%,transparent);box-shadow:0 18px 60px -32px rgba(0,0,0,.65);outline:1px solid color-mix(in srgb,var(--foreground) 5%,transparent);transition:.2s}.composer:focus-within{border-color:color-mix(in srgb,var(--primary) 45%,var(--border));outline-color:color-mix(in srgb,var(--primary) 15%,transparent);box-shadow:0 22px 70px -34px rgba(0,0,0,.75)}textarea{display:block;width:100%;min-height:96px;max-height:192px;resize:none;border:0;outline:0;padding:16px 20px 12px;line-height:28px;color:var(--foreground);background:transparent}.footer{border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent);background:color-mix(in srgb,var(--muted) 20%,transparent);padding:10px 12px;backdrop-filter:blur(8px)}.control-row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px}.tools{display:flex;gap:4px;align-items:center;padding:4px;border:1px solid color-mix(in srgb,var(--border) 60%,transparent);border-radius:8px;background:color-mix(in srgb,var(--background) 70%,transparent);box-shadow:0 1px 2px rgba(0,0,0,.04)}.icon-btn,.send,.model{height:32px;border-radius:7px;border:0;background:transparent;color:var(--muted-foreground);padding:0 8px}.icon-btn{width:32px;padding:0;font-size:16px}.icon-btn:hover{background:color-mix(in srgb,var(--muted) 70%,transparent);color:var(--foreground)}.icon-btn.on{background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary)}.icon-btn.danger:hover{background:color-mix(in srgb,var(--destructive) 10%,transparent);color:var(--destructive)}.right{display:flex;align-items:center;gap:8px}.model{max-width:240px;border:1px solid var(--border);background:color-mix(in srgb,var(--background) 80%,transparent);color:var(--foreground);font-weight:600;text-align:left}.send{padding:0 12px;background:var(--primary);color:var(--primary-foreground);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}.send.stop{border:1px solid color-mix(in srgb,var(--destructive) 25%,transparent);background:color-mix(in srgb,var(--destructive) 10%,transparent);color:var(--destructive)}.params{display:none;position:absolute;bottom:58px;left:0;width:352px;max-width:calc(100vw - 32px);border:1px solid var(--border);border-radius:10px;background:#fff;padding:12px;box-shadow:0 12px 28px rgba(0,0,0,.12)}.param-open{display:block}.param-title{font-weight:600}.param-desc{font-size:12px;color:var(--muted-foreground);margin:3px 0 10px}.param-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid color-mix(in srgb,var(--border) 70%,transparent);border-radius:8px;margin-top:7px}.param-row label{font-size:13px}.param-row select{border:0;outline:0;color:var(--muted-foreground);background:transparent}.tool-area{position:relative}
.messages{max-width:896px;margin:auto}.message{display:flex;flex-direction:row-reverse;padding:10px 0}.bubble{width:100%;min-width:0}.message.user .bubble{margin-left:160px;padding:12px 14px;border-radius:10px;background:var(--muted)}.message.ai .bubble{margin-right:110px}.meta{font-size:12px;color:var(--muted-foreground);margin-bottom:5px}.stream:after{content:'▋';animation:blink .9s infinite}@keyframes blink{50%{opacity:0}}
.results{max-width:896px;margin:auto}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.image{overflow:hidden;border:1px solid var(--border);border-radius:10px;background:#fff}.art{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(145deg,#e0e7ff,#dbeafe 55%,#fef3c7);color:#475569}.shimmer{background:linear-gradient(90deg,#f4f4f5,#e4e4e7,#f4f4f5);background-size:200% 100%;animation:shim 1.1s infinite;color:transparent}@keyframes shim{to{background-position:-200% 0}}.image footer{display:flex;gap:6px;justify-content:space-between;padding:8px}.small-btn{border:1px solid var(--border);border-radius:6px;padding:4px 8px;background:#fff;font-size:12px;color:var(--muted-foreground)}.video-card{overflow:hidden;border:1px solid var(--border);border-radius:10px;background:#fff;margin-bottom:12px}.video-screen{height:260px;display:grid;place-items:center;background:#18181b;color:white}.play{width:44px;height:44px;border:1px solid #fff;border-radius:50%;background:#ffffff18;color:white;font-size:18px}.video-info{padding:10px 12px;display:flex;align-items:center;gap:10px}.video-title{font-weight:600}.task-meta{font-size:12px;color:var(--muted-foreground)}.status{margin-left:auto;padding:3px 8px;border-radius:999px;font-size:12px}.pending{color:#b54708;background:#fffaeb}.done{color:#067647;background:#ecfdf3}
@media(max-width:767px){.inner{padding:16px}.input-wrap{padding-bottom:0}.empty{padding-top:32px}.empty h2{font-size:20px}.control-row{flex-direction:column;align-items:stretch}.right{justify-content:flex-end}.model{order:-1;margin-left:auto}.tools{justify-content:flex-start}.message.user .bubble{margin-left:28px}.message.ai .bubble{margin-right:14px}.gallery{grid-template-columns:repeat(2,1fr)}.video-screen{height:190px}}@media(max-width:639px){.prompts{grid-template-columns:1fr}.send{font-size:0;width:32px;padding:0}.send:after{content:'➤';font-size:15px}}
</style>
</head>
<body><main class="page"><div class="notice">游乐场试玩将按正式 API 相同的权限、额度与计费规则处理。</div><section class="content"><div class="inner" id="main"></div></section><section class="input-wrap"><div class="composer"><textarea id="prompt" placeholder="Ask anything"></textarea><div class="footer"><div class="control-row"><div class="tools" id="tools"></div><div class="right"><select class="model" id="model" onchange="switchModel()"><option value="gpt">◉ gpt-4o · default</option><option value="image">◉ dall-e-3 · default</option><option value="video">◉ sora-2 · premium</option><option value="disabled">◉ archived-video · 已关闭</option></select><button class="send" id="submit" onclick="submitPrompt()">Send</button></div></div></div></div></section></main>
<script>
let mode='gpt',search=false,history=[],videoTasks=[],imageResults=[];const configs={gpt:{title:'Start a playground chat',desc:'Test a model with a starter prompt, or write your own request below.',icon:'▢',items:[['▥','Analyze data'],['▤','Summarize text'],['⌘','Code'],['⌑','Get advice']]},image:{title:'生成一张图片',desc:'选择图片模型后，输入提示词并按正式图片接口同步出图。',icon:'▧',items:[['▧','生成产品海报'],['◌','创建角色头像'],['◇','设计品牌图标'],['⌁','绘制自然风景']]},video:{title:'生成一段视频',desc:'视频任务会显示处理状态，成功后可在页面播放结果。',icon:'▷',items:[['▷','城市日落延时'],['◌','花园里的橘猫'],['◇','产品动态展示'],['⌁','电影感风景镜头']]}};
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function starter(t){prompt.value=t;prompt.focus()}function empty(){let c=configs[mode];return `<div class="empty"><div class="empty-body"><div class="empty-icon">${c.icon}</div><div><h2>${c.title}</h2><p>${c.desc}</p></div><div class="prompts">${c.items.map(x=>`<button class="prompt" onclick="starter('${x[1]}')"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div></div></div>`}
function render(){let html='';if(mode==='gpt')html=history.length?`<div class="messages">${history.map(m=>`<article class="message ${m.role}"><div class="bubble"><div class="meta">${m.role==='user'?'You':'gpt-4o'}</div><div class="${m.stream?'stream':''}">${esc(m.text)}</div></div></article>`).join('')}</div>`:empty();if(mode==='image')html=imageResults.length?`<div class="results"><div class="gallery">${imageResults.map(item=>`<article class="image"><div class="art ${item.loading?'shimmer':''}">${item.loading?'生成中':`图片结果 ${item.index}`}</div><footer><span class="task-meta">${esc(item.text).slice(0,16)}…</span><button class="small-btn" onclick="alert('Mock：打开图片预览')">预览</button></footer></article>`).join('')}</div></div>`:empty();if(mode==='video')html=videoTasks.length?`<div class="results">${videoTasks.map(v=>`<article class="video-card"><div class="video-screen">${v.done?`<button class="play" onclick="alert('Mock：正式版将使用 /v1/videos/${v.id}/content 播放')">▶</button>`:`<span>正在生成 · ${v.progress}%</span>`}</div><div class="video-info"><div><div class="video-title">${esc(v.text)}</div><div class="task-meta">${v.id} · ${v.duration} 秒</div></div><span class="status ${v.done?'done':'pending'}">${v.done?'已完成':'处理中'}</span>${!v.done?'<button class="small-btn" onclick="alert(\'正在自动轮询任务状态\')">刷新</button>':''}</div></article>`).join('')}</div>`:empty();main.innerHTML=html;tools.innerHTML=toolHTML();prompt.placeholder=mode==='gpt'?'Ask anything':mode==='image'?'Describe the image you want to generate':'Describe the video you want to generate';submit.textContent=mode==='gpt'?'Send':'Generate'}
function toolHTML(){if(mode==='gpt')return `<button class="icon-btn" title="Attach">⌇</button><button class="icon-btn ${search?'on':''}" onclick="search=!search;render()" title="Search">◎</button><span class="tool-area"><button class="icon-btn" onclick="document.getElementById('params').classList.toggle('param-open')" title="Parameters">☷</button><div class="params" id="params"><div class="param-title">Parameter settings</div><div class="param-desc">Only enabled parameters are sent with the request.</div><div class="param-row"><label>Temperature</label><select><option>0.7</option></select></div><div class="param-row"><label>Top P</label><select><option>1.0</option></select></div><div class="param-row"><label>Max Tokens</label><select><option>4096</option></select></div></span><button class="icon-btn danger" ${history.length?'':'disabled'} onclick="history=[];render()" title="Clear chat history">⌫</button>`;if(mode==='image')return `<span class="tool-area"><button class="icon-btn" onclick="document.getElementById('params').classList.toggle('param-open')" title="Image parameters">☷</button><div class="params" id="params"><div class="param-title">Image settings</div><div class="param-desc">Only supported model parameters are sent.</div><div class="param-row"><label>Image count</label><select><option>1</option><option>2</option><option>4</option></select></div><div class="param-row"><label>Size</label><select><option>1024×1024</option><option>1024×1792</option></select></div><div class="param-row"><label>Quality</label><select><option>standard</option><option>hd</option></select></div></div></span>`;return `<span class="tool-area"><button class="icon-btn" onclick="document.getElementById('params').classList.toggle('param-open')" title="Video parameters">☷</button><div class="params" id="params"><div class="param-title">Video settings</div><div class="param-desc">Video duration follows the formal task limit.</div><div class="param-row"><label>Duration</label><select id="dur"><option>5</option><option>10</option></select></div><div class="param-row"><label>Size</label><select><option>1280×720</option><option>720×1280</option></select></div></div></span>`}
function switchModel(){let v=model.value;if(v==='disabled'){alert('该模型已被管理员关闭，无法选择。');model.value=mode;return}mode=v;render()}function submitPrompt(){let text=prompt.value.trim();if(!text)return;if(mode==='gpt'){history.push({role:'user',text});history.push({role:'ai',text:'Responding...',stream:true});prompt.value='';render();setTimeout(()=>{history[history.length-1]={role:'ai',text:'这是原型中的流式回复。真实实现会保留当前 Playground 的 SSE、推理过程、来源引用与计费链路。'};render()},800);return}if(mode==='image'){imageResults=[1,2,3].map(index=>({index,text,loading:true}));prompt.value='';render();setTimeout(()=>{imageResults=imageResults.map(item=>({...item,loading:false}));render()},900);return}let id='task_'+Math.random().toString(36).slice(2,9);videoTasks.unshift({id,text,duration:5,progress:0,done:false});prompt.value='';render();let timer=setInterval(()=>{let t=videoTasks.find(x=>x.id===id);if(!t)return clearInterval(timer);t.progress+=25;if(t.progress>=100){t.progress=100;t.done=true;clearInterval(timer)}render()},650)}render();
</script></body></html>
